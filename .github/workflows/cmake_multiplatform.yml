name: cmake[windows:cl, ubuntu:gcc]

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false so if Linux fails, Windows still runs (and vice-versa)
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake --preset default
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build/default --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir build/default --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Test Install
      # Validates that GNUInstallDirs and target exports are correctly configured
      run: >
        cmake --install build/default
        --config ${{ matrix.build_type }}
        --prefix ${{ github.workspace }}/install_test_dir

    - name: Package Source
      # Explicitly use the source config to prevent CPack from attempting binary packaging.
      run: cpack --config build/default/CPackSourceConfig.cmake